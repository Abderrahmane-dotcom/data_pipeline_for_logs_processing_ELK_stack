input {
  beats {
    port => 5044
  }
}

filter {
  ruby {
    code => "
      @metadata ||= {}
      file = event.get('log.file.path')
      @metadata[file] ||= {}

      line = event.get('message')

      # Extraction des champs header
      if line =~ /^builder:/
        @metadata[file]['builder'] = line.split(':',2)[1].strip
      elsif line =~ /^slave:/
        @metadata[file]['slave'] = line.split(':',2)[1].strip
      elsif line =~ /^starttime:/
        @metadata[file]['starttime'] = line.split(':',2)[1].strip
      elsif line =~ /^results:/
        @metadata[file]['results'] = line.split(':',2)[1].strip
      elsif line =~ /^buildid:/
        @metadata[file]['buildid'] = line.split(':',2)[1].strip
      elsif line =~ /^builduid:/
        @metadata[file]['builduid'] = line.split(':',2)[1].strip
      elsif line =~ /^revision:/
        @metadata[file]['revision'] = line.split(':',2)[1].strip
      end

      # Enrichir chaque ligne avec le contexte global
      if !@metadata[file].empty?
        @metadata[file].each do |k,v|
          event.set(k, v)
        end
      end
    "
  }

  # --- Ajouts utiles pour la détection d’anomalies ---
  grok {
    match => {
      "message" => [
        "program finished with exit code %{NUMBER:exit_code:int}",
        "elapsedTime=%{NUMBER:elapsed_time:float}",
        "results: %{WORD:result_status}",
        "WARNING: %{GREEDYDATA:warning_message}"
      ]
    }
  }

  # Convertir starttime Unix en format date lisible
  date {
    match => ["starttime", "UNIX"]
    target => "@timestamp"
  }

  mutate {
    lowercase => ["result_status"]
    convert => {
      "elapsed_time" => "float"
      "exit_code" => "integer"
    }
  }

  # Créer des indicateurs de succès/échec
  if [result_status] and [result_status] != "success" {
    mutate { add_field => { "is_error" => true } }
  } else {
    mutate { add_field => { "is_error" => false } }
  }

  # Nettoyage pour éviter le bruit
  if [message] =~ /^=/ or [message] =~ /^\s*$/ {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "test_devoir_2_logs"
  }
}